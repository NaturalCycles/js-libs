# Shared pnpm workspace config, consumed as a config dependency (https://pnpm.io/config-includes).

minimumReleaseAgeExclude:
  - '@naturalcycles/*'
  - vitest
  - '@vitest/*'
  - oxfmt
  - '@oxfmt/*'
  - eslint-plugin-oxlint
  - oxlint
  - oxlint-tsgolint
  - '@oxlint/*'
  - '@oxlint-tsgolint/*'
# Below settings are one-liners and are not "worth" to be shared (-1 line, +1 line in the target config)
# trustLockfile: true
# trustPolicyExcludePrune: true
# trustPolicy: no-downgrade
# Below settings are kept as defaults.
# minimumReleaseAge: 1440
# blockExoticSubdeps: true
# strictDepBuilds: true
