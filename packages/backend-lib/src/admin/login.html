<!doctype html>
<html>
  <head>
    <title>Login</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <style>
      body {
        max-width: 45rem;
        margin: 0 auto;
        padding: 40px 1rem;
        font-family: system-ui, sans-serif;
        font-size: 1.15rem;
        line-height: 1.5;
      }
      pre {
        padding: 1rem 1.4rem;
        overflow-x: auto;
        background: #f5f7ff;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      button {
        padding: 1rem 1.4rem;
        font-size: 1.5rem;
        color: #fff;
        cursor: pointer;
        background: #0d47a1;
        border: none;
        border-radius: 5px;
      }
      button:hover {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <pre id="loading">Checking login...</pre>

    <div id="loggedIn" hidden>
      <p>Logged in as:</p>
      <pre><code id="email"></code></pre>
      <pre><code id="token"></code></pre>
      <button id="logoutButton">Logout</button>
    </div>

    <div id="loggedOut" hidden>
      <button id="loginBtn">Login</button>
    </div>

    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js'
      import {
        getAuth,
        GoogleAuthProvider,
        onAuthStateChanged,
        signInWithRedirect,
        signOut,
      } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js'

      const apiKey = '<%= firebaseApiKey %>'
      const authDomain = '<%= firebaseAuthDomain %>'
      // const authProvider = '<%= firebaseAuthProvider %>'

      if (!apiKey || !authDomain) {
        alert(`Error: 'apiKey' or 'authDomain' is missing!`)
      }

      const qs = Object.fromEntries(new URLSearchParams(location.search))
      const { autoLogin, adminTokenKey = 'admin_token' } = qs
      const returnUrl = toSafeReturnUrl(qs.returnUrl)
      // console.log(qs)

      // Initialize Firebase
      const auth = getAuth(
        initializeApp({
          apiKey,
          authDomain,
        }),
      )
      const provider = new GoogleAuthProvider()

      const el = {
        loading: document.getElementById('loading'),
        loggedIn: document.getElementById('loggedIn'),
        loggedOut: document.getElementById('loggedOut'),
        email: document.getElementById('email'),
        token: document.getElementById('token'),
      }

      document.getElementById('loginBtn').addEventListener('click', login)
      document.getElementById('logoutButton').addEventListener('click', logout)

      onAuthStateChanged(auth, user => {
        // console.log('onAuthStateChanged, user: ', JSON.stringify(user, null, 2))
        // console.log('onAuthStateChanged, user: ', user)
        void onUser(user)
      })

      if (qs.logout) void logout()

      ////

      async function onUser(user) {
        try {
          // alert('onUser')
          render(user)
          if (!user) {
            if (autoLogin) void login()
          } else {
            const token = await user.getIdToken()

            // alert('idToken')
            // console.log(idToken)
            render(user, token)

            await postToken(token)

            // Redirect if needed
            if (returnUrl) {
              // alert(`Logged in as ${user.email}, redirecting back...`)
              location.href = returnUrl
            }
          }
        } catch (err) {
          logError(err)
        }
      }

      function render(user, token = '') {
        el.loading.hidden = true
        el.loggedIn.hidden = !user
        el.loggedOut.hidden = !!user
        el.email.textContent = user?.email || ''
        el.token.textContent = token
      }

      async function login() {
        try {
          await signInWithRedirect(auth, provider)
        } catch (err) {
          logError(err)
        }
      }

      async function logout() {
        try {
          await signOut(auth)

          await postToken('logout') // magic string

          if (qs.logout && returnUrl) {
            alert('Logged out, redirecting back...')
            location.href = returnUrl
          }
        } catch (err) {
          logError(err)
        }
      }

      function logError(err) {
        console.error(err)
        alert('Error\n ' + JSON.stringify(err, null, 2))
      }

      /**
       * `returnUrl` is client-controlled. Only http(s) urls are allowed:
       * anything else (e.g `javascript:`) would otherwise be executed by `location.href = returnUrl`
       * in the context of this page, where the token is exposed.
       */
      function toSafeReturnUrl(url) {
        if (!url) return
        try {
          const { protocol } = new URL(url, location.href)
          if (protocol === 'http:' || protocol === 'https:') return url
        } catch {}
        console.warn('ignoring invalid returnUrl', url)
      }

      async function postToken(token) {
        await fetch(`/admin/login`, {
          method: 'post',
          headers: {
            Authentication: token,
          },
        })
      }
    </script>
  </body>
</html>
