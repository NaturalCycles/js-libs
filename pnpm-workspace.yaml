include:
  ./packages/pnpm-config/pnpm.config.yaml: '*'
packages:
  - packages/*
catalog:
  '@types/node': ^26
  'typescript': ^7
  oxlint: ^1
  'oxlint-tsgolint': ^7
allowBuilds:
  esbuild: true
  '@firebase/util': false
  protobufjs: false
autoDedupe: true
auditConfig:
  ignoreGhsas:
    - GHSA-h755-8qp9-cq85
    - GHSA-67mh-4wv8-2f99
ignoreWorkspaceCycles: true
trustLockfile: true
trustPolicyExcludePrune: true
trustPolicy: no-downgrade
