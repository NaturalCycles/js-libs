packages:
  - packages/*
catalog:
  '@types/node': ^26
  'typescript': ^7
  oxlint: ^1
  'oxlint-tsgolint': ^7
minimumReleaseAgeExclude:
  - '@naturalcycles/*'
  - vitest
  - '@vitest/*'
  - oxfmt
  - '@oxfmt/*'
  - eslint-plugin-oxlint
  - oxlint
  - oxlint-tsgolint
  - '@oxlint/*'
  - '@oxlint-tsgolint/*'
trustLockfile: true
trustPolicyExcludePrune: true
trustPolicy: no-downgrade
blockExoticSubdeps: true
auditConfig:
  ignoreGhsas:
    - GHSA-h755-8qp9-cq85
    - GHSA-67mh-4wv8-2f99
strictDepBuilds: true
ignoreWorkspaceCycles: true
publicHoistPattern:
  - typescript
allowBuilds:
  esbuild: true
  '@firebase/util': false
  protobufjs: false
update:
  githubActions: false
